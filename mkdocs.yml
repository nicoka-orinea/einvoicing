# Project configuration
site_name: European Invoicing (eInvoicing)
site_url: https://josemmo.github.io/einvoicing/
repo_name: josemmo/einvoicing
repo_url: https://github.com/josemmo/einvoicing
edit_uri: ""

# Theme customization
theme:
  name: material
  logo: logo-white.svg
  favicon: favicon.png
  palette:
    scheme: slate
    primary: blue
    accent: yellow
  features:
    - navigation.tabs

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.superfences

