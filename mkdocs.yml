# Project configuration
site_name: European Invoicing (eInvoicing)
site_url: https://josemmo.github.io/einvoicing/
repo_name: josemmo/einvoicing
repo_url: https://github.com/josemmo/einvoicing
edit_uri: ""

# Theme customization
theme:
  name: material
  logo: logo-white.svg
  favicon: favicon.png
  palette:
    scheme: slate
    primary: blue
    accent: yellow
  features:
    - navigation.tabs

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.superfences

# Table of Contents
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - EU e-Invoicing core concepts: getting-started/eu-einvoicing-concepts.md
    - Creating your first invoice: getting-started/your-first-invoice.md
    - Importing, exporting and validating documents: getting-started/importing-exporting-and-validating.md
    - CDAR status mapping: getting-started/cdar-status-mapping.md
    - Importing CDAR XML: getting-started/importing-cdar.md
    - Exporting CDAR XML: getting-started/exporting-cdar.md
    - Creating custom presets: getting-started/creating-custom-presets.md
  - Reference:
    - CDAR overview: reference/cdar-overview.md
    - CrossDomainAcknowledgementAndResponse: reference/cross-domain-acknowledgement-and-response.md
    - DocumentContext: reference/cdar-document-context.md
    - TradeParty: reference/cdar-trade-party.md
    - ExchangedDocument: reference/cdar-exchanged-document.md
    - AcknowledgementDocument: reference/cdar-acknowledgement-document.md
    - ReferenceReferencedDocument: reference/cdar-reference-referenced-document.md
    - SpecifiedDocumentStatus: reference/cdar-specified-document-status.md
    - SpecifiedDocumentCharacteristic: reference/cdar-specified-document-characteristic.md
    - ValueAmount: reference/cdar-value-amount.md
    - CDAR enums: reference/cdar-enums.md
    - CDAR mapping: reference/cdar-mapping.md
